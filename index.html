<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Lyrics Generator</title>
    <style>
      /* Simple transition for a smoother UI feel */
      .transition-all {
        transition: all 0.3s ease-in-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-in-out;
      }

      /* High Contrast Light Theme Styles */
      body.light-theme {
        background-color: #f8fafc !important;
        color: #0f172a !important;
      }
      body.light-theme .bg-gray-900,
      body.light-theme .bg-gray-950 {
        background-color: #f1f5f9 !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
      }
      body.light-theme .bg-gray-800 {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05) !important;
      }
      body.light-theme .bg-gray-700 {
        background-color: #e2e8f0 !important;
        color: #1e293b !important;
        border-color: #cbd5e1 !important;
      }
      body.light-theme .text-white {
        color: #0f172a !important;
      }
      body.light-theme .text-gray-100,
      body.light-theme .text-gray-200,
      body.light-theme .text-gray-300 {
        color: #334155 !important;
      }
      body.light-theme .text-gray-400 {
        color: #475569 !important;
      }
      body.light-theme .text-gray-500 {
        color: #64748b !important;
      }
      body.light-theme .border-gray-800,
      body.light-theme .border-gray-700,
      body.light-theme .border-gray-600 {
        border-color: #cbd5e1 !important;
      }
      body.light-theme input,
      body.light-theme select,
      body.light-theme textarea {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-color: #94a3b8 !important;
      }
      body.light-theme input::placeholder,
      body.light-theme textarea::placeholder {
        color: #64748b !important;
      }
      body.light-theme .bg-teal-950,
      body.light-theme .bg-teal-950\/60,
      body.light-theme .bg-teal-950\/80 {
        background-color: #ccfbf1 !important;
        color: #0f766e !important;
        border-color: #5eead4 !important;
      }
      body.light-theme .text-teal-300,
      body.light-theme .text-teal-400 {
        color: #0d9488 !important;
      }
      body.light-theme .bg-purple-950,
      body.light-theme .bg-purple-950\/80 {
        background-color: #f3e8ff !important;
        color: #7e22ce !important;
        border-color: #d8b4fe !important;
      }
      body.light-theme .text-purple-300,
      body.light-theme .text-purple-400 {
        color: #7e22ce !important;
      }
      body.light-theme header {
        background-color: rgba(255, 255, 255, 0.95) !important;
        border-color: #cbd5e1 !important;
      }
    </style>
  </head>
  <body class="bg-gray-900 text-gray-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
